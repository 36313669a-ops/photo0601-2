<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>作品頁</title>
<style>
body { font-family: Arial; background:#111; color:white; text-align:center; }
img { max-width:90%; margin-top:10px; }
button { padding:10px; margin:5px; }
</style>
</head>
<body>

<h2 id="title"></h2>
<img id="photo">

<br>

<button onclick="vote(1)">👍 投票</button>
<button onclick="vote(-1)">↩ 收回票</button>

<p id="count"></p>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  projectId: "YOUR_ID"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const id = new URLSearchParams(location.search).get("id");

document.getElementById("title").innerText = "作品 " + id;
document.getElementById("photo").src = `PHOTO/${id}.jpg`;

const ref = db.collection("photos").doc(id);

// 初始化
ref.get().then(doc => {
  if (!doc.exists) ref.set({ votes: 0 });
  update();
});

function update() {
  ref.get().then(doc => {
    document.getElementById("count").innerText =
      "目前票數：" + (doc.data()?.votes || 0);
  });
}

function vote(n) {
  ref.get().then(doc => {
    let v = doc.data()?.votes || 0;
    v += n;
    if (v < 0) v = 0;
    ref.set({ votes: v });
    update();
  });
}
</script>

</body>
</html>
